# Cek BACA-SAJA API Hostinger & kondisi situs tugas.palletmeshindonesia.com (alat/hostinger.mjs cek: hanya GET,
# tidak mengubah apa pun). Jalankan manual: Actions → Hostinger (cek) → Run workflow. Hasil di ringkasan run.
# Butuh secret HOSTINGER_API_TOKEN (hPanel → Profil → API).
name: Hostinger (cek)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cek:
    name: Cek baca-saja
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node alat/hostinger.mjs cek
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
