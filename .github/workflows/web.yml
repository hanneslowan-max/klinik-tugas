# Web Next.js (web/): cek otomatis, lalu deploy ke Hostinger lewat API (alat/hostinger.mjs).
#
#   Pull request yang menyentuh web/, supabase/ atau alat deploy → cek + tes end-to-end (gerbang sebelum merge).
#   Push ke main → cek + tes end-to-end; bila SEMUA lolos dan variabel HOSTINGER_AKTIF=1, web/ di-deploy ke
#     tugas.palletmeshindonesia.com: sumber diunggah, Hostinger build (npm run build), lalu workflow menunggu sampai
#     situs menyajikan commit ini. Kode yang gagal tes tidak pernah sampai ke Hostinger; build Hostinger yang gagal
#     tidak mengganti situs (tetap versi terakhir yang sukses).
#   Manual (Actions → Web → Run workflow di main): cek + deploy ulang tanpa perubahan kode. Centang
#     `timpa_situs_lama` HANYA untuk deploy pertama (situs belum app Node.js → isi lamanya ditimpa permanen).
#
# Settings → Secrets and variables → Actions:
#   secret   HOSTINGER_API_TOKEN       token API hPanel (Profil → API)
#   variabel SUPABASE_PUBLISHABLE_KEY  publishable key project produksi (publik: memang ikut terkirim ke browser)
#   variabel HOSTINGER_AKTIF=1         saklar deploy; kosong = hanya cek & tes
# Tes tidak memakai secret: stack Supabase LOKAL di runner (seed sintetis).
name: Web

on:
  pull_request:
    paths: ["web/**", "supabase/**", "alat/hostinger*.mjs", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "supabase/**", "alat/hostinger*.mjs", ".github/workflows/web.yml"]
  workflow_dispatch:
    inputs:
      timpa_situs_lama:
        description: "Deploy PERTAMA saja: izinkan menimpa situs tugas.palletmeshindonesia.com yang belum app Node.js (isi lama hilang permanen)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  # run main tidak dibatalkan di tengah deploy; run baru menunggu
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cek:
    name: Typecheck, lint, tes unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # hanya supaya build lolos di CI (bukan nilai produksi)
      NEXT_PUBLIC_SUPABASE_URL: https://contoh-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-bukan-kunci-asli
      NEXT_PUBLIC_APP_BASE_URL: https://tugas.palletmeshindonesia.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tes unit (Vitest)
        run: npm run uji
      - name: Build produksi
        run: npm run build
      - name: Tes alat deploy Hostinger (server tiruan)
        working-directory: .
        run: node --test alat/hostinger.test.mjs

  e2e:
    name: Tes end-to-end (Supabase lokal + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stack Supabase lokal (migrasi + seed sintetis, termasuk Realtime)
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,mailpit

      - name: Konfigurasi web ke stack lokal
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "NEXT_PUBLIC_APP_BASE_URL=http://127.0.0.1:3000"
          } > web/.env.production.local

      - name: Pasang & build
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Jalankan build produksi
        working-directory: web
        run: |
          nohup npx next start -H 127.0.0.1 -p 3000 > next.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/masuk && exit 0; sleep 1; done
          cat next.log; exit 1

      - name: Playwright (HP + desktop)
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test -c tests/e2e/playwright.config.ts

      - name: Simpan laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-e2e
          path: |
            web/tests/e2e/hasil/
            web/next.log
          retention-days: 7

  deploy:
    name: Deploy ke Hostinger (API)
    needs: [cek, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.HOSTINGER_AKTIF == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-hostinger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unggah sumber, build di Hostinger, tunggu situs menyajikan commit ini
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          IZINKAN_TIMPA_SITUS_LAMA: ${{ github.event_name == 'workflow_dispatch' && inputs.timpa_situs_lama && 'ya' || '' }}
        run: node alat/hostinger.mjs deploy
