# Web Next.js (web/): cek otomatis untuk setiap pull request dan push ke main.
#
# Deploy dilakukan Hostinger sendiri: Node.js Web App di hPanel terhubung ke repo ini lewat Git (branch `main`, root
# directory `web`), jadi setiap push ke main langsung di-build & dijalankan Hostinger. Workflow ini adalah GERBANG
# SEBELUM MERGE: merge PR hanya bila semua job hijau.
#
#   cek              typecheck, lint, tes unit, build (Ubuntu)
#   build-hostinger  npm install + npm run build + jalankan server standalone di AlmaLinux 8 (glibc 2.28), sama dengan
#                    server build Hostinger: SWC native Next.js butuh glibc 2.29 sehingga di sana Next memakai SWC WASM
#                    + webpack. Menangkap perubahan yang hanya gagal di Hostinger (mis. dependensi native baru).
#   e2e              Supabase lokal di runner (seed sintetis) + Playwright HP & desktop terhadap build produksi
# Tidak ada secret di workflow ini.
name: Web

on:
  pull_request:
    paths: ["web/**", "supabase/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "supabase/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cek:
    name: Typecheck, lint, tes unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # hanya supaya build lolos di CI (bukan nilai produksi)
      NEXT_PUBLIC_SUPABASE_URL: https://contoh-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-bukan-kunci-asli
      NEXT_PUBLIC_APP_BASE_URL: https://tugas.palletmeshindonesia.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tes unit (Vitest)
        run: npm run uji
      - name: Build produksi
        run: npm run build

  build-hostinger:
    name: Build seperti server Hostinger (AlmaLinux 8, glibc 2.28)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: public.ecr.aws/docker/library/almalinux:8
    defaults:
      run:
        shell: bash
        working-directory: web
    env:
      # hanya supaya build lolos di CI (bukan nilai produksi)
      NEXT_PUBLIC_SUPABASE_URL: https://contoh-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-bukan-kunci-asli
      NEXT_PUBLIC_APP_BASE_URL: https://tugas.palletmeshindonesia.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Konfigurasi aman untuk SWC WASM
        run: |
          # Hostinger membungkus next.config.ts dengan config TypeScript buatannya; di SWC WASM bungkus itu gagal dimuat
          # (ERR_MODULE_NOT_FOUND). next.config.mjs dimuat Node langsung. Turbopack butuh SWC native → build --webpack.
          if [ -e next.config.ts ]; then echo "::error::pakai next.config.mjs, bukan next.config.ts (lihat web/README.md)"; exit 1; fi
          grep -q '"build": "next build --webpack"' package.json || { echo "::error::script build harus next build --webpack"; exit 1; }
      - name: Pasang dependensi seperti Hostinger (npm install)
        run: npm install --no-audit --no-fund
      - name: Build (npm run build, termasuk postbuild)
        run: npm run build 2>&1 | tee build.log
      - name: Server standalone melayani halaman, CSS/JS, dan berkas public
        run: |
          grep -q "GLIBC_2.29" build.log || echo "::warning::SWC native termuat: job ini tidak lagi meniru server Hostinger"
          test -f .next/standalone/server.js
          (cd .next/standalone && PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > ../../server.log 2>&1 &)
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/masuk && break; sleep 1; done
          html=$(curl -sf http://127.0.0.1:3000/masuk) || { cat server.log; exit 1; }
          for berkas in $(echo "$html" | grep -o '/_next/static/[^"]*\.\(css\|js\)' | head -3) /icon.svg /sw.js /manifest.webmanifest; do
            kode=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$berkas")
            echo "$berkas → $kode"; [ "$kode" = 200 ] || { cat server.log; exit 1; }
          done

  e2e:
    name: Tes end-to-end (Supabase lokal + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stack Supabase lokal (migrasi + seed sintetis, termasuk Realtime)
        run: supabase start -x studio,imgproxy,vector,logflare,supavisor,mailpit

      - name: Konfigurasi web ke stack lokal
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "NEXT_PUBLIC_APP_BASE_URL=http://127.0.0.1:3000"
          } > web/.env.production.local

      - name: Pasang & build
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Jalankan build produksi
        working-directory: web
        run: |
          nohup npx next start -H 127.0.0.1 -p 3000 > next.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/masuk && exit 0; sleep 1; done
          cat next.log; exit 1

      - name: Playwright (HP + desktop)
        working-directory: web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npx playwright test -c tests/e2e/playwright.config.ts

      - name: Simpan laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-e2e
          path: |
            web/tests/e2e/hasil/
            web/next.log
          retention-days: 7
